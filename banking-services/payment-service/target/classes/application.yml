server:
  port: 8087

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://payment-db:5432/payment_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

bank:
  outbox:
    poll-interval-ms: 2000
  services:
    fraud-service-url: ${FRAUD_SERVICE_URL:http://fraud-service:8093}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId},%X{traceId:-},%X{spanId:-}]"
