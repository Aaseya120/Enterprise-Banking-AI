server:
  port: 8093

spring:
  application:
    name: fraud-service
  datasource:
    url: jdbc:postgresql://fraud-db:5432/fraud_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

bank:
  fraud:
    threshold:
      max-single-transaction: 10000
    velocity:
      max-transactions: 5
      window-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId},%X{traceId:-},%X{spanId:-}]"
