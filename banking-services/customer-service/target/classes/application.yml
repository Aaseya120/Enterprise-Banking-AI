server:
  port: 8086

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://customer-db:5432/customer_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only verifies entities match it
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Passphrase used to derive the AES-256 key that encrypts nationalId at
# rest (see CustomerService, CryptoUtil.deriveAesKeyBase64). Same demo-secret
# caveat as the gateway's JWT signing key: this is fine for local/demo use,
# but a real deployment must source this from Vault/Secrets Manager/KMS,
# never from a committed application.yml.
bank:
  crypto:
    national-id-key: "change-me-this-is-a-demo-passphrase-not-for-production-0123456789"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId},%X{traceId:-},%X{spanId:-}]"
