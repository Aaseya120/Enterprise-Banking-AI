# .github/workflows/ci.yml
#
# CI pipeline: triggered on every push and pull request.
#
# What it does:
#   1. Build and test all Maven modules (fail-fast on compile/test error)
#   2. Detect which services changed (path filters)
#   3. For each changed service: build Docker image and push to ECR
#      (only on push to main, not on PRs — avoids ECR image spam)
#
# Secrets required (set in repo Settings > Secrets and variables > Actions):
#   AWS_CI_ROLE_ARN   — IAM role with ECR push and EKS read permissions (OIDC)
#
# Environment variables required (set as repository variables):
#   AWS_REGION         — e.g., us-east-1
#   ECR_REGISTRY       — e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com
#   EKS_CLUSTER_NAME   — e.g., banking-dev-eks

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  # ─── Step 1: Build and test all modules ──────────────────────────────────

  build-and-test:
    name: Maven build + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and test all modules
        run: mvn -B -q clean verify
        # -B: batch mode (no interactive prompts)
        # -q: quiet (only errors and summaries)
        # verify: compile + test + package (but not install/deploy)

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()   # only upload on failure to save storage
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7

  # ─── Step 2: Detect changed services ─────────────────────────────────────

  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      # Each output is "true" if that service's source changed
      api-gateway:                      ${{ steps.filter.outputs.api-gateway }}
      ai-orchestrator-service:          ${{ steps.filter.outputs.ai-orchestrator-service }}
      account-service:                  ${{ steps.filter.outputs.account-service }}
      rag-service:                      ${{ steps.filter.outputs.rag-service }}
      mcp-gateway-service:              ${{ steps.filter.outputs.mcp-gateway-service }}
      transfer-service:                 ${{ steps.filter.outputs.transfer-service }}
      fraud-ai-service:                 ${{ steps.filter.outputs.fraud-ai-service }}
      customer-service:                 ${{ steps.filter.outputs.customer-service }}
      payment-service:                  ${{ steps.filter.outputs.payment-service }}
      transaction-service:              ${{ steps.filter.outputs.transaction-service }}
      card-service:                     ${{ steps.filter.outputs.card-service }}
      loan-service:                     ${{ steps.filter.outputs.loan-service }}
      notification-service:             ${{ steps.filter.outputs.notification-service }}
      audit-service:                    ${{ steps.filter.outputs.audit-service }}
      fraud-service:                    ${{ steps.filter.outputs.fraud-service }}
      knowledge-service:                ${{ steps.filter.outputs.knowledge-service }}
      document-intelligence-service:    ${{ steps.filter.outputs.document-intelligence-service }}
      report-insight-service:           ${{ steps.filter.outputs.report-insight-service }}
      # common module changes affect every service
      common-changed:                   ${{ steps.filter.outputs.common }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - 'infrastructure/api-gateway/**'
              - 'common/**'
            ai-orchestrator-service:
              - 'ai-platform/ai-orchestrator-service/**'
              - 'ai-platform/ai-model-gateway/**'
              - 'common/**'
            account-service:
              - 'banking-services/account-service/**'
              - 'common/**'
            rag-service:
              - 'ai-platform/rag-service/**'
              - 'common/**'
            mcp-gateway-service:
              - 'ai-platform/mcp-gateway-service/**'
              - 'common/**'
            transfer-service:
              - 'banking-services/transfer-service/**'
              - 'common/**'
            fraud-ai-service:
              - 'ai-platform/fraud-ai-service/**'
              - 'common/**'
            customer-service:
              - 'banking-services/customer-service/**'
              - 'common/**'
            payment-service:
              - 'banking-services/payment-service/**'
              - 'common/**'
            transaction-service:
              - 'banking-services/transaction-service/**'
              - 'common/**'
            card-service:
              - 'banking-services/card-service/**'
              - 'common/**'
            loan-service:
              - 'banking-services/loan-service/**'
              - 'common/**'
            notification-service:
              - 'banking-services/notification-service/**'
              - 'common/**'
            audit-service:
              - 'banking-services/audit-service/**'
              - 'common/**'
            fraud-service:
              - 'banking-services/fraud-service/**'
              - 'common/**'
            knowledge-service:
              - 'ai-platform/knowledge-service/**'
              - 'common/**'
            document-intelligence-service:
              - 'ai-platform/document-intelligence-service/**'
              - 'common/**'
            report-insight-service:
              - 'ai-platform/report-insight-service/**'
              - 'common/**'
            common:
              - 'common/**'

  # ─── Step 3: Build Docker images for changed services (push to main only) ─

  build-api-gateway:
    name: Docker — api-gateway
    needs: [build-and-test, detect-changes]
    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.api-gateway == 'true'
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service: api-gateway
      module_path: infrastructure/api-gateway
      jar_name: api-gateway
      ecr_repo: ${{ vars.ECR_REGISTRY }}/banking-dev/api-gateway
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      image_tag: ${{ github.sha }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_CI_ROLE_ARN }}

  build-account-service:
