server:
  port: 8096

spring:
  application:
    name: report-insight-service
  datasource:
    url: jdbc:postgresql://report-db:5432/report_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

bank:
  services:
    transaction-service:
      base-url: http://localhost:8088
  ai:
    providers:
      default-provider: OPENAI
      fallback-provider: CLAUDE
      openai:
        enabled: false
      claude:
        enabled: false
      gemini:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId},%X{traceId:-},%X{spanId:-}]"
