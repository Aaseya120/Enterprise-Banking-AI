# values-fraud-service.yaml
nameOverride: fraud-service
fullnameOverride: fraud-service

image:
  repository: # <account>.dkr.ecr.<region>.amazonaws.com/fraud-service
  tag: latest

containerPort: 8093
managementPort: 8094

service:
  type: ClusterIP
  port: 80
  targetPort: 8093

database:
  enabled: true
  host: ""    # fraud-db.xxxx.us-east-1.rds.amazonaws.com
  port: 5432
  name: fraud_db
  username: postgres
  existingSecret: "fraud-service-db-secret"
  secretKey: "db-password"

kafka:
  enabled: false

replicaCount: 2
autoscaling:
  minReplicas: 2
  maxReplicas: 6

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
