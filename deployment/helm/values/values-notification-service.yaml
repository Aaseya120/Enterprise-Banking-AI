# values-notification-service.yaml
nameOverride: notification-service
fullnameOverride: notification-service

image:
  repository: # <account>.dkr.ecr.<region>.amazonaws.com/notification-service
  tag: latest

containerPort: 8091
managementPort: 8092

service:
  type: ClusterIP
  port: 80
  targetPort: 8091

database:
  enabled: true
  host: ""    # notification-db.xxxx.us-east-1.rds.amazonaws.com
  port: 5432
  name: notification_db
  username: postgres
  existingSecret: "notification-service-db-secret"
  secretKey: "db-password"

kafka:
  enabled: true
  bootstrapServers: ""  # MSK bootstrap endpoint

replicaCount: 2
autoscaling:
  minReplicas: 2
  maxReplicas: 6

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
