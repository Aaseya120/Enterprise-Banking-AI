apiVersion: v1
kind: Service
metadata:
  name: {{ include "banking-microservice.fullname" . }}
  labels:
    {{- include "banking-microservice.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ include "banking-microservice.portName" . }}
      protocol: TCP
      name: http
    - port: {{ .Values.managementPort }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "banking-microservice.selectorLabels" . | nindent 4 }}
