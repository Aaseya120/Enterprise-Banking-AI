{{/*
Secret template — only rendered when at least one secret value is set.
In production, database.existingSecret should point to a pre-created
Kubernetes Secret (e.g., sourced from AWS Secrets Manager via External Secrets
Operator) rather than having the password in the Helm release values.
This fallback path (values-supplied password) exists for local dev / CI only.
*/}}
{{- if and .Values.database.enabled (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "banking-microservice.fullname" . }}
  labels:
    {{- include "banking-microservice.labels" . | nindent 4 }}
  annotations:
    # Prevent helm diff tools from leaking secret values in plan output
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Secret values come from --set or from a values file that is NOT committed
  # to source control (gitignored). In CI/CD, injected from GitHub Secrets /
  # AWS Secrets Manager via the deploy workflow.
  {{- if .Values.database.password }}
  db-password: {{ .Values.database.password | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSigningKey }}
  jwt-signing-key: {{ .Values.secrets.jwtSigningKey | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionPassphrase }}
  encryption-passphrase: {{ .Values.secrets.encryptionPassphrase | quote }}
  {{- end }}
  {{- if .Values.secrets.fraudDecisionHmacSecret }}
  fraud-decision-hmac-secret: {{ .Values.secrets.fraudDecisionHmacSecret | quote }}
  {{- end }}
{{- end }}
