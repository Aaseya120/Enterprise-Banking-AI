global:
  scrape_interval: 15s
  evaluation_interval: 15s

# One job per service, scraping Micrometer's Prometheus-format endpoint
# (management.endpoints.web.exposure.include: ...,prometheus in each
# service's application.yml). Inside the docker-compose network, every
# service is reachable at "<service-name>:<port>" -- same hostnames used
# throughout docker-compose.yml and each service's own application.yml.
scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'ai-orchestrator-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ai-orchestrator-service:8080']

  - job_name: 'account-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['account-service:8081']

  - job_name: 'rag-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['rag-service:8082']

  - job_name: 'mcp-gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['mcp-gateway-service:8083']

  - job_name: 'transfer-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['transfer-service:8084']

  - job_name: 'fraud-ai-service'
