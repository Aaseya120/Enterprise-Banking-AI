server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"
      routes:
        - id: account-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/accounts/**
        - id: ai-orchestrator-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/ai/**
        - id: rag-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/rag/**
        - id: knowledge-service
          uri: http://localhost:8094
          predicates:
            - Path=/api/v1/knowledge/**
        - id: document-intelligence-service
          uri: http://localhost:8095
          predicates:
            - Path=/api/v1/documents/**
        - id: report-insight-service
          uri: http://localhost:8096
          predicates:
            - Path=/api/v1/insights/**
        - id: mcp-gateway-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/mcp/**
        - id: transfer-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/transfers/**
        - id: payment-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/payments/**
        - id: transaction-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/transactions/**
        - id: card-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/cards/**
        - id: loan-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/loans/**
        - id: notification-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/notifications/**
        - id: audit-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/v1/audit/**
        - id: fraud-service
          uri: http://localhost:8093
          predicates:
            - Path=/api/v1/fraud/**
        - id: customer-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/customers/**

# NOTE: fraud-ai-service (port 8085) has no REST controller -- it's a pure
# Kafka consumer (banking.transfer.events in, a callback to transfer-service
# out) -- so it deliberately has no gateway route. fraud-service (port 8093,
# routed above) is the separate deterministic business-rule engine
# (threshold/blacklist/velocity checks via POST /api/v1/fraud/evaluate) --
# not yet called synchronously by payment-service or transfer-service before
# they commit; see task.md.

# --- Default (no profile) mode: demo HS256 issuer ---
# JWT validation IS enforced (JwtAuthenticationGlobalFilter): every request
# except /api/v1/auth/** and /actuator/health must carry a valid
# "Authorization: Bearer <jwt>" or the gateway returns 401 before routing.
# POST /api/v1/auth/login (handled locally by AuthController, not routed)
# issues a token for one of the 5 demo users in DemoUserStore. This is a
# demo HS256 issuer standing in for Keycloak/OIDC -- see JwtSupport and
# DemoUserStore javadocs. To use real Keycloak instead, run with
# --spring.profiles.active=keycloak (see the profile block below and
# README) -- AuthController/JwtAuthenticationGlobalFilter/JwtConfig all
# deactivate automatically under that profile, replaced by
# KeycloakSecurityConfig/KeycloakIdentityPropagationFilter.
#
# CHANGE THIS SECRET before any non-local use -- it is committed to git,
# which is exactly what plan section 36 says never to do for a real secret.
# In production this belongs in Vault/Secrets Manager, injected via env var.
bank:
  security:
    jwt:
      secret: "change-me-this-is-a-demo-secret-not-for-production-use-0123456789"
      expiry-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId},%X{traceId:-},%X{spanId:-}]"

---
# --- keycloak profile: real OAuth2 resource server validation ---
# Activate with --spring.profiles.active=keycloak (or
# SPRING_PROFILES_ACTIVE=keycloak). issuer-uri points at the "banking"
# realm in the docker-compose Keycloak container (deployment/docker/keycloak/
# banking-realm.json defines the realm, its 5 roles, and 5 demo users
# matching DemoUserStore's usernames/passwords for continuity). Spring
# Boot fetches Keycloak's signing keys from its JWKS endpoint automatically
# from this issuer-uri -- no shared secret to manage on this side at all,
# unlike the demo mode above.
spring:
  config:
    activate:
      on-profile: keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/banking

